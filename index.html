<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe Psicolaboral</title>
<meta name="description" content="Generador de informes psicolaborales: notas de entrevista, competencias y dictamen, con descarga en PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: two-column workbench — form on the left, report sheet on the right; stacks on phones */
  :root {
    --bg: #eef1f3; --surface: #ffffff; --sheet: #fdfdfc; --fg: #1b2530; --muted: #5d6b78;
    --line: #d5dce2; --accent: #1f5f73; --accent-soft: #dcebef; --ochre: #a8741a;
    --ok: #2e7d4f; --warn: #a8741a; --bad: #a83a32;
    --display: "IBM Plex Serif", Georgia, serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12181d; --surface: #1a2229; --sheet: #1e272f; --fg: #e3e9ee; --muted: #93a2ae;
    --line: #2f3b45; --accent: #6fb3c7; --accent-soft: #1d3640; --ochre: #d6a24a;
    --ok: #6cc28f; --warn: #d6a24a; --bad: #e07d74; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #12181d; --surface: #1a2229; --sheet: #1e272f; --fg: #e3e9ee; --muted: #93a2ae;
    --line: #2f3b45; --accent: #6fb3c7; --accent-soft: #1d3640; --ochre: #d6a24a;
    --ok: #6cc28f; --warn: #d6a24a; --bad: #e07d74; color-scheme: dark }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
  h1, h2, h3 { text-wrap: balance; }
  .label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .field { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--fg); font: inherit; }
  .field:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  textarea.field { resize: vertical; min-height: 200px; line-height: 1.6; }
  button:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { accent-color: var(--accent); }
  .tabnum { font-variant-numeric: tabular-nums; }
  .sheet { background: var(--sheet); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(20,40,50,.18); }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none } }
</style>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    bg: "var(--bg)", surface: "var(--surface)", sheet: "var(--sheet)", fg: "var(--fg)", muted: "var(--muted)",
    line: "var(--line)", accent: "var(--accent)", accentsoft: "var(--accent-soft)", ochre: "var(--ochre)",
    ok: "var(--ok)", warn: "var(--warn)", bad: "var(--bad)" },
    fontFamily: { display: ["IBM Plex Serif", "Georgia", "serif"], mono: ["IBM Plex Mono", "monospace"] } } } };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div id="root"></div>

<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

const COMPETENCIAS = ["Comunicación", "Trabajo en equipo", "Liderazgo", "Orientación a resultados", "Adaptabilidad", "Resolución de problemas", "Tolerancia a la presión"];
const NIVELES = { 1: "Bajo", 2: "En desarrollo", 3: "Adecuado", 4: "Sólido", 5: "Sobresaliente" };
const PRUEBAS = ["Entrevista por competencias", "DISC", "16PF", "Big Five (NEO)", "Wartegg", "Raven", "Assessment center"];
const DICTAMENES = ["Recomendado", "Recomendado con observaciones", "No recomendado"];

const EJEMPLO = {
  nombre: "María Fernanda Rojas", documento: "V-18.452.330", edad: "34", cargo: "Coordinadora de Operaciones",
  area: "Logística", fecha: new Date().toISOString().slice(0, 10), evaluador: "Lic. Andrés Pérez, Psicólogo Organizacional",
  motivo: "Proceso de selección externa",
  notas: "Llega puntual, presentación formal. Discurso fluido y ordenado, responde con ejemplos concretos (método STAR). Describe su experiencia de 6 años en una distribuidora donde redujo tiempos de despacho en 18% reorganizando turnos. Refiere que prefiere decidir con datos y que le cuesta delegar tareas críticas; lo reconoce y dice estar trabajando en ello. Ante la pregunta de conflicto con un par, narra una mediación exitosa con el área de compras. Muestra algo de ansiedad al hablar de cierres de mes con plazos ajustados, aunque menciona estrategias de planificación. Motivación principal: crecimiento y estabilidad. Expectativa salarial dentro del rango. DISC con predominio C-D.",
  competencias: { "Comunicación": 4, "Trabajo en equipo": 4, "Liderazgo": 3, "Orientación a resultados": 5, "Adaptabilidad": 3, "Resolución de problemas": 4, "Tolerancia a la presión": 2 },
  pruebas: ["Entrevista por competencias", "DISC", "16PF"],
  dictamen: "Recomendado con observaciones",
};
const VACIO = { ...EJEMPLO, nombre: "", documento: "", edad: "", cargo: "", area: "", evaluador: "", motivo: "", notas: "",
  competencias: Object.fromEntries(COMPETENCIAS.map(c => [c, 3])), pruebas: ["Entrevista por competencias"], dictamen: "Recomendado" };

/* ---------- Generación local (plantilla) ---------- */
function generarLocal(f) {
  const nom = f.nombre || "El/la candidato/a";
  const pila = (f.nombre || "").split(" ")[0] || "El/la evaluado/a";
  const comp = Object.entries(f.competencias);
  const altas = comp.filter(([, v]) => v >= 4).sort((a, b) => b[1] - a[1]);
  const bajas = comp.filter(([, v]) => v <= 2).sort((a, b) => a[1] - b[1]);
  const medias = comp.filter(([, v]) => v === 3);
  const prom = comp.reduce((s, [, v]) => s + v, 0) / comp.length;
  const frases = f.notas.split(/(?<=[.;])\s+/).map(s => s.trim()).filter(s => s.length > 8);
  const descr = {
    "Comunicación": "expresa sus ideas con claridad y estructura, adaptando el discurso al interlocutor",
    "Trabajo en equipo": "colabora con pares y prioriza objetivos compartidos sobre los individuales",
    "Liderazgo": "orienta y moviliza a otros hacia metas comunes",
    "Orientación a resultados": "se fija metas medibles y sostiene el esfuerzo hasta alcanzarlas",
    "Adaptabilidad": "ajusta su conducta ante cambios de contexto o prioridades",
    "Resolución de problemas": "analiza situaciones, identifica causas y propone alternativas viables",
    "Tolerancia a la presión": "mantiene el desempeño y el control emocional bajo exigencia",
  };
  return {
    objetivo: `Evaluar la idoneidad psicolaboral de ${nom} para el cargo de ${f.cargo || "[cargo]"}${f.area ? " en el área de " + f.area : ""}, en el marco de: ${(f.motivo || "proceso de evaluación").toLowerCase()}. Se integran los hallazgos de la entrevista y de los instrumentos aplicados.`,
    sintesis: frases.length
      ? `En la entrevista se registraron las siguientes observaciones conductuales y de contenido: ${frases.slice(0, 8).join(" ")}`
      : "No se registraron notas de entrevista.",
    perfil: `El perfil global se ubica en un nivel ${prom >= 4 ? "sólido" : prom >= 3 ? "adecuado" : "en desarrollo"} (promedio ${prom.toFixed(1)} sobre 5). ${altas.length ? `Destaca en ${altas.map(a => a[0].toLowerCase()).join(", ")}.` : ""} ${medias.length ? `Muestra un desempeño adecuado en ${medias.map(a => a[0].toLowerCase()).join(", ")}.` : ""}`.trim(),
    fortalezas: altas.length ? altas.map(([c, v]) => `${c} (${NIVELES[v]}): ${descr[c]}.`) : ["No se identifican competencias en nivel sólido o superior."],
    areas: bajas.length ? bajas.map(([c, v]) => `${c} (${NIVELES[v]}): se sugiere un plan de desarrollo con acompañamiento y metas de seguimiento. Conducta esperada: ${descr[c]}.`) : ["No se identifican brechas críticas; se sugiere plan de desarrollo estándar del cargo."],
    conclusion: `${pila} presenta un perfil ${f.dictamen === "No recomendado" ? "que no se ajusta en este momento" : "compatible"} con los requerimientos del cargo de ${f.cargo || "[cargo]"}. ${bajas.length && f.dictamen !== "No recomendado" ? `Se recomienda atender ${bajas.map(b => b[0].toLowerCase()).join(" y ")} durante el período de inducción.` : ""} Dictamen: ${f.dictamen.toUpperCase()}.`.replace(/\s+/g, " "),
  };
}

/* ---------- Generación con Claude ---------- */
function promptIA(f) {
  return `Eres un psicólogo organizacional senior. Redacta, en español formal y en tercera persona, las secciones de un informe psicolaboral a partir de los datos de una evaluación. No inventes datos que no estén en las notas; si algo no se evaluó, no lo menciones. Usa lenguaje técnico pero comprensible para un gerente de línea. Respeta el dictamen dado por el evaluador.

DATOS
Nombre: ${f.nombre}
Edad: ${f.edad}
Cargo al que aplica: ${f.cargo}
Área: ${f.area}
Motivo de la evaluación: ${f.motivo}
Instrumentos aplicados: ${f.pruebas.join(", ")}
Competencias (escala 1-5): ${Object.entries(f.competencias).map(([k, v]) => `${k}: ${v} (${NIVELES[v]})`).join("; ")}
Dictamen del evaluador: ${f.dictamen}

NOTAS DE ENTREVISTA
${f.notas}

Responde SOLO con un objeto JSON con estas claves (todas en string salvo las listas):
{"objetivo": "1-2 frases", "sintesis": "párrafo de 90-150 palabras con lo observado en la entrevista", "perfil": "párrafo de 60-110 palabras integrando competencias e instrumentos", "fortalezas": ["3-5 frases breves"], "areas": ["2-4 frases breves con sugerencia de desarrollo"], "conclusion": "párrafo de 50-90 palabras que cierre con el dictamen"}`;
}

/* ---------- Texto plano ---------- */
function informeTexto(f, r) {
  const L = [];
  L.push("INFORME DE EVALUACIÓN PSICOLABORAL", "Confidencial", "");
  L.push("1. DATOS DE IDENTIFICACIÓN");
  [["Nombre", f.nombre], ["Documento", f.documento], ["Edad", f.edad && f.edad + " años"], ["Cargo", f.cargo], ["Área", f.area], ["Fecha", fechaLarga(f.fecha)], ["Evaluador", f.evaluador]]
    .forEach(([k, v]) => v && L.push(`${k}: ${v}`));
  L.push("", "2. OBJETIVO", r.objetivo, "", "3. INSTRUMENTOS APLICADOS", ...f.pruebas.map(p => "- " + p));
  L.push("", "4. SÍNTESIS DE LA ENTREVISTA", r.sintesis, "", "5. PERFIL DE COMPETENCIAS");
  Object.entries(f.competencias).forEach(([k, v]) => L.push(`- ${k}: ${v}/5 (${NIVELES[v]})`));
  L.push("", r.perfil, "", "6. FORTALEZAS", ...r.fortalezas.map(x => "- " + x), "", "7. ÁREAS DE DESARROLLO", ...r.areas.map(x => "- " + x));
  L.push("", "8. CONCLUSIÓN Y DICTAMEN", r.conclusion, "", `Dictamen: ${f.dictamen}`, "", "_______________________", f.evaluador || "Evaluador");
  return L.join("\n");
}
function fechaLarga(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
}

/* ---------- PDF ---------- */
function construirPDF(f, r) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 20, CW = W - 2 * M; let y = 0;
  const ACC = [31, 95, 115], INK = [27, 37, 48], MUT = [93, 107, 120];
  const header = () => {
    doc.setFillColor(...ACC); doc.rect(0, 0, W, 4, "F");
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...MUT);
    doc.text("INFORME PSICOLABORAL · CONFIDENCIAL", M, 12); doc.text(f.nombre || "", W - M, 12, { align: "right" });
    y = 22;
  };
  const need = h => { if (y + h > 280) { doc.addPage(); header(); } };
  const titulo = t => { need(14); y += 4; doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...ACC); doc.text(t.toUpperCase(), M, y); y += 2; doc.setDrawColor(213, 220, 226); doc.line(M, y, W - M, y); y += 6; };
  const parrafo = (t, opts = {}) => {
    doc.setFont("helvetica", opts.bold ? "bold" : "normal"); doc.setFontSize(10); doc.setTextColor(...INK);
    const lines = doc.splitTextToSize(t, CW - (opts.indent || 0));
    lines.forEach(l => { need(5.2); doc.text(l, M + (opts.indent || 0), y); y += 5.2; });
    y += opts.gap ?? 2;
  };
  const vineta = t => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...INK);
    const lines = doc.splitTextToSize(t, CW - 6);
    lines.forEach((l, i) => { need(5.2); if (!i) { doc.setFillColor(...ACC); doc.circle(M + 1.5, y - 1.3, .8, "F"); } doc.text(l, M + 6, y); y += 5.2; });
    y += 1;
  };
  // Portada / encabezado
  doc.setFillColor(...ACC); doc.rect(0, 0, W, 4, "F");
  y = 24; doc.setFont("times", "bold"); doc.setFontSize(20); doc.setTextColor(...INK);
  doc.text("Informe de Evaluación Psicolaboral", M, y); y += 7;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...MUT);
  doc.text(`Documento confidencial · ${fechaLarga(f.fecha)}`, M, y); y += 6;
  titulo("1. Datos de identificación");
  const datos = [["Nombre", f.nombre], ["Documento", f.documento], ["Edad", f.edad && f.edad + " años"], ["Cargo", f.cargo], ["Área", f.area], ["Motivo", f.motivo], ["Evaluador", f.evaluador]].filter(d => d[1]);
  datos.forEach(([k, v]) => { need(6); doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(...MUT); doc.text(k, M, y); doc.setFont("helvetica", "normal"); doc.setTextColor(...INK); doc.text(doc.splitTextToSize(String(v), CW - 35)[0], M + 35, y); y += 6; });
  titulo("2. Objetivo"); parrafo(r.objetivo);
  titulo("3. Instrumentos aplicados"); f.pruebas.forEach(vineta);
  titulo("4. Síntesis de la entrevista"); parrafo(r.sintesis);
  titulo("5. Perfil de competencias");
  Object.entries(f.competencias).forEach(([k, v]) => {
    need(8); doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(k, M, y);
    const bx = M + 62, bw = 80;
    doc.setFillColor(228, 233, 237); doc.roundedRect(bx, y - 3.2, bw, 3.6, 1, 1, "F");
    const col = v <= 2 ? [168, 58, 50] : v === 3 ? [168, 116, 26] : ACC;
    doc.setFillColor(...col); doc.roundedRect(bx, y - 3.2, bw * v / 5, 3.6, 1, 1, "F");
    doc.setTextColor(...MUT); doc.text(`${v}/5 · ${NIVELES[v]}`, bx + bw + 4, y); y += 7;
  });
  y += 2; parrafo(r.perfil);
  titulo("6. Fortalezas"); r.fortalezas.forEach(vineta);
  titulo("7. Áreas de desarrollo"); r.areas.forEach(vineta);
  titulo("8. Conclusión y dictamen"); parrafo(r.conclusion);
  need(14); const dc = f.dictamen === "Recomendado" ? [46, 125, 79] : f.dictamen === "No recomendado" ? [168, 58, 50] : [168, 116, 26];
  doc.setDrawColor(...dc); doc.setLineWidth(.6); doc.roundedRect(M, y, CW, 10, 1.5, 1.5, "S"); doc.setLineWidth(.2);
  doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...dc); doc.text(`DICTAMEN: ${f.dictamen.toUpperCase()}`, M + 5, y + 6.5); y += 26;
  need(20); doc.setDrawColor(...MUT); doc.line(M, y, M + 70, y); y += 5;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...INK); doc.text(f.evaluador || "Evaluador", M, y);
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(...MUT); doc.text(`Página ${i} de ${n}`, W - M, 290, { align: "right" }); }
  return doc;
}

/* ---------- UI ---------- */
function Campo({ id, label, value, onChange, type = "text", placeholder }) {
  return html`<label htmlFor=${id} className="flex flex-col gap-1 min-w-0">
    <span className="label">${label}</span>
    <input id=${id} type=${type} className="field" value=${value} placeholder=${placeholder} onChange=${e => onChange(e.target.value)} />
  </label>`;
}

function Seccion({ n, titulo, children }) {
  return html`<section className="flex flex-col gap-2">
    <h3 className="flex items-baseline gap-3 border-b border-line pb-1">
      <span className="font-mono text-xs text-accent tabnum">${String(n).padStart(2, "0")}</span>
      <span className="font-display text-[17px] font-semibold">${titulo}</span>
    </h3>
    ${children}
  </section>`;
}

function App() {
  const [f, setF] = useState(EJEMPLO);
  const [r, setR] = useState(null);
  const [estado, setEstado] = useState("idle"); // idle | generando
  const [modo, setModo] = useState("plantilla");
  const [aviso, setAviso] = useState(null);
  const [ia, setIa] = useState(null);
  const [dl, setDl] = useState(null);
  const ctl = useRef(null);
  const textoRef = useRef(null);
  const esEjemplo = f.nombre === EJEMPLO.nombre && f.notas === EJEMPLO.notas;

  useEffect(() => {
    let vivo = true;
    (async () => {
      const [s, d] = await Promise.all([window.claude?.use?.("sample") ?? null, window.claude?.use?.("downloads") ?? null]);
      if (!vivo) return; setIa(s); setDl(d); if (s) setModo("ia");
    })();
    return () => { vivo = false; };
  }, []);

  const set = k => v => setF(p => ({ ...p, [k]: v }));
  const notificar = (msg, tipo = "ok") => { setAviso({ msg, tipo }); setTimeout(() => setAviso(null), 3200); };

  async function generar() {
    if (!f.nombre.trim() || !f.cargo.trim() || f.notas.trim().length < 30) {
      notificar("Completa nombre, cargo y al menos unas líneas de notas de entrevista.", "bad"); return;
    }
    setEstado("generando"); setR(null);
    if (modo === "ia" && ia) {
      ctl.current = new AbortController();
      try {
        const res = await ia.json(promptIA(f), { signal: ctl.current.signal, modelTier: "default" });
        const base = generarLocal(f);
        const lista = x => Array.isArray(x) && x.length ? x.map(String) : null;
        setR({ objetivo: res.objetivo || base.objetivo, sintesis: res.sintesis || base.sintesis, perfil: res.perfil || base.perfil,
          fortalezas: lista(res.fortalezas) || base.fortalezas, areas: lista(res.areas) || base.areas, conclusion: res.conclusion || base.conclusion, fuente: "Claude" });
      } catch (e) {
        if (e?.code === "cancelled") { setEstado("idle"); return; }
        if (e?.code === "not_granted") setIa(null);
        setR({ ...generarLocal(f), fuente: "plantilla" });
        notificar("No se pudo redactar con Claude; se generó con la plantilla local.", "warn");
      }
    } else {
      await new Promise(res => setTimeout(res, 900));
      setR({ ...generarLocal(f), fuente: "plantilla" });
    }
    setEstado("idle");
  }

  async function copiar() {
    const t = informeTexto(f, r);
    try { await navigator.clipboard.writeText(t); notificar("Informe copiado al portapapeles."); }
    catch {
      const el = textoRef.current; el.hidden = false; el.value = t; el.focus(); el.select();
      notificar("Texto seleccionado: pulsa Ctrl+C (⌘+C) para copiarlo.", "warn");
    }
  }

  async function descargar() {
    const doc = construirPDF(f, r);
    const nombre = `Informe_psicolaboral_${(f.nombre || "candidato").replace(/[^\p{L}\p{N}]+/gu, "_")}.pdf`;
    if (!dl) { doc.save(nombre); notificar("PDF descargado."); return; }
    try { await dl.save({ filename: nombre, data: doc.output("blob") }); notificar("PDF listo."); }
    catch (e) { if (e?.code !== "declined") notificar(e?.code === "rate_limited" ? "Ya hay una descarga pendiente de confirmar." : "No se pudo descargar el PDF.", "bad"); }
  }

  const colorNivel = v => v <= 2 ? "bg-bad" : v === 3 ? "bg-warn" : "bg-accent";
  const colorDict = { "Recomendado": "text-ok border-ok", "Recomendado con observaciones": "text-warn border-warn", "No recomendado": "text-bad border-bad" };

  return html`<div className="wrap max-w-[1320px] mx-auto">
    <header className="flex flex-wrap items-end justify-between gap-3 mb-6">
      <div>
        <p className="label text-accent">Gestión del Talento Humano</p>
        <h1 className="font-display text-[28px] leading-tight font-semibold">Generador de informes psicolaborales</h1>
        <p className="text-muted text-sm mt-1 max-w-[62ch]">Registra los datos y notas de la entrevista, valora las competencias y genera un informe estructurado listo para descargar en PDF o copiar.</p>
      </div>
    </header>

    <div className="grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.1fr)] items-start">

      <form className="bg-surface border border-line rounded-lg p-5 flex flex-col gap-6 min-w-0" onSubmit=${e => { e.preventDefault(); generar(); }}>
        ${esEjemplo && html`<div className="flex flex-wrap items-center justify-between gap-2 bg-accentsoft rounded-md px-3 py-2 text-sm">
          <span>Datos de ejemplo cargados para mostrar el resultado.</span>
          <button type="button" className="font-semibold text-accent underline underline-offset-2" onClick=${() => { setF({ ...VACIO, fecha: new Date().toISOString().slice(0, 10) }); setR(null); }}>Empezar en blanco</button>
        </div>`}

        <fieldset className="flex flex-col gap-3">
          <legend className="font-display text-lg font-semibold mb-2">Datos del candidato</legend>
          <div className="grid gap-3 sm:grid-cols-2">
            <${Campo} id="nombre" label="Nombre completo" value=${f.nombre} onChange=${set("nombre")} />
            <${Campo} id="documento" label="Documento de identidad" value=${f.documento} onChange=${set("documento")} placeholder="V-00.000.000" />
            <${Campo} id="cargo" label="Cargo al que aplica" value=${f.cargo} onChange=${set("cargo")} />
            <${Campo} id="area" label="Área / Departamento" value=${f.area} onChange=${set("area")} />
            <${Campo} id="edad" label="Edad" type="number" value=${f.edad} onChange=${set("edad")} />
            <${Campo} id="fecha" label="Fecha de evaluación" type="date" value=${f.fecha} onChange=${set("fecha")} />
            <${Campo} id="motivo" label="Motivo de la evaluación" value=${f.motivo} onChange=${set("motivo")} placeholder="Selección, promoción, desarrollo…" />
            <${Campo} id="evaluador" label="Evaluador/a" value=${f.evaluador} onChange=${set("evaluador")} />
          </div>
        </fieldset>

        <fieldset className="flex flex-col gap-2">
          <legend className="font-display text-lg font-semibold mb-2">Instrumentos aplicados</legend>
          <div className="flex flex-wrap gap-2">
            ${PRUEBAS.map(p => {
              const on = f.pruebas.includes(p);
              return html`<button type="button" key=${p} aria-pressed=${on}
                className=${"px-3 py-1.5 rounded-full text-sm border transition-colors " + (on ? "bg-accent text-sheet border-accent" : "border-line text-fg hover:border-accent")}
                onClick=${() => setF(x => ({ ...x, pruebas: on ? x.pruebas.filter(q => q !== p) : [...x.pruebas, p] }))}>${p}</button>`;
            })}
          </div>
        </fieldset>

        <fieldset className="flex flex-col gap-2">
          <legend className="font-display text-lg font-semibold mb-1">Notas de la entrevista</legend>
          <p className="text-muted text-sm">Escribe lo observado: conducta, ejemplos relatados, motivación, resultados de pruebas.</p>
          <textarea id="notas" className="field" value=${f.notas} onChange=${e => set("notas")(e.target.value)} placeholder="Ej.: Llega puntual, discurso fluido, relata experiencia en…"></textarea>
          <span className="text-xs text-muted self-end tabnum">${f.notas.trim() ? f.notas.trim().split(/\s+/).length : 0} palabras</span>
        </fieldset>

        <fieldset className="flex flex-col gap-3">
          <legend className="font-display text-lg font-semibold mb-1">Valoración de competencias <span className="text-muted text-sm font-normal">escala 1–5</span></legend>
          ${COMPETENCIAS.map(c => {
            const v = f.competencias[c]; const id = "c-" + c.replace(/\s+/g, "-");
            return html`<div key=${c} className="grid grid-cols-[minmax(0,1fr)_auto] sm:grid-cols-[180px_minmax(0,1fr)_120px] items-center gap-x-3 gap-y-1">
              <label htmlFor=${id} className="text-sm font-medium">${c}</label>
              <span className="text-xs text-muted tabnum sm:order-3 text-right">${v} · ${NIVELES[v]}</span>
              <input id=${id} type="range" min="1" max="5" step="1" value=${v} className="col-span-2 sm:col-span-1 w-full"
                onChange=${e => setF(x => ({ ...x, competencias: { ...x.competencias, [c]: +e.target.value } }))} />
            </div>`;
          })}
        </fieldset>

        <fieldset className="flex flex-col gap-2">
          <legend className="font-display text-lg font-semibold mb-2">Dictamen del evaluador</legend>
          <div className="flex flex-wrap gap-2">
            ${DICTAMENES.map(d => html`<label key=${d} className=${"flex items-center gap-2 px-3 py-2 rounded-md border text-sm cursor-pointer " + (f.dictamen === d ? colorDict[d] + " font-semibold" : "border-line")}>
              <input type="radio" name="dictamen" id=${"d-" + d} className="accent-[var(--accent)]" checked=${f.dictamen === d} onChange=${() => set("dictamen")(d)} />${d}
            </label>`)}
          </div>
        </fieldset>

        <div className="flex flex-col gap-3 border-t border-line pt-4">
          ${ia && html`<div className="flex flex-wrap items-center gap-2 text-sm" role="radiogroup" aria-label="Modo de redacción">
            <span className="label mr-1">Redacción</span>
            ${[["ia", "Con Claude (IA)"], ["plantilla", "Plantilla rápida"]].map(([k, t]) => html`<button type="button" key=${k} role="radio" aria-checked=${modo === k}
              className=${"px-3 py-1 rounded-md border " + (modo === k ? "border-accent text-accent font-semibold bg-accentsoft" : "border-line text-muted")} onClick=${() => setModo(k)}>${t}</button>`)}
          </div>`}
          <div className="flex flex-wrap gap-2">
            <button type="submit" disabled=${estado === "generando"} className="inline-flex items-center gap-2 bg-accent text-sheet font-semibold px-5 py-2.5 rounded-md hover:opacity-90 disabled:opacity-60">
              ${estado === "generando" && html`<svg className="spin" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeOpacity=".3" strokeWidth="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" strokeWidth="3"/></svg>`}
              ${estado === "generando" ? (modo === "ia" && ia ? "Redactando con Claude…" : "Generando…") : "Generar informe"}
            </button>
            ${estado === "generando" && modo === "ia" && ia && html`<button type="button" className="px-4 py-2.5 rounded-md border border-line" onClick=${() => ctl.current?.abort()}>Detener</button>`}
          </div>
          ${modo === "ia" && ia && html`<p className="text-xs text-muted">La redacción con IA usa tu cuenta de Claude y puede tardar hasta un minuto. Revisa siempre el texto antes de firmarlo.</p>`}
        </div>
      </form>


      <div className="lg:sticky lg:top-4 flex flex-col gap-3 min-w-0">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <h2 className="label">Vista previa del informe</h2>
          ${r && html`<div className="flex flex-wrap gap-2">
            <button type="button" onClick=${copiar} className="px-4 py-2 rounded-md border border-line bg-surface text-sm font-medium hover:border-accent">Copiar texto</button>
            ${html`<button type="button" onClick=${descargar} className="px-4 py-2 rounded-md bg-accent text-sheet text-sm font-semibold hover:opacity-90">Descargar PDF</button>`}
          </div>`}
        </div>
        <textarea ref=${textoRef} id="texto-copia" hidden className="field text-xs font-mono" style=${{ minHeight: "120px" }} readOnly></textarea>

        <article className="sheet rounded-sm px-6 sm:px-10 py-8 flex flex-col gap-6 min-h-[560px] lg:max-h-[calc(100vh-110px)] lg:overflow-y-auto">
          ${!r && estado !== "generando" && html`<div className="m-auto text-center flex flex-col gap-2 max-w-[38ch] text-muted">
            <svg className="mx-auto" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>
            <p className="font-display text-lg text-fg">El informe aparecerá aquí</p>
            <p className="text-sm">Revisa los datos del formulario y pulsa <b>Generar informe</b>.</p>
          </div>`}
          ${estado === "generando" && html`<div className="flex flex-col gap-4 animate-pulse" aria-label="Generando informe">
            ${[70, 40, 95, 88, 92, 60, 85, 75].map((w, i) => html`<div key=${i} className="h-3 rounded bg-line" style=${{ width: w + "%" }}></div>`)}
          </div>`}
          ${r && estado !== "generando" && html`<${React.Fragment}>
            <header className="flex flex-col gap-1 border-b-2 border-accent pb-4">
              <span className="label">Documento confidencial · ${fechaLarga(f.fecha)}</span>
              <h2 className="font-display text-[24px] leading-tight font-semibold">Informe de Evaluación Psicolaboral</h2>
              <span className="text-xs text-muted">Redactado con ${r.fuente === "Claude" ? "Claude" : "plantilla local"}</span>
            </header>
            <${Seccion} n=${1} titulo="Datos de identificación">
              <dl className="grid grid-cols-[110px_minmax(0,1fr)] gap-x-4 gap-y-1 text-sm">
                ${[["Nombre", f.nombre], ["Documento", f.documento], ["Edad", f.edad && f.edad + " años"], ["Cargo", f.cargo], ["Área", f.area], ["Motivo", f.motivo], ["Evaluador", f.evaluador]].filter(d => d[1])
                  .map(([k, v]) => html`<${React.Fragment} key=${k}><dt className="text-muted">${k}</dt><dd className="min-w-0 break-words">${v}</dd></${React.Fragment}>`)}
              </dl>
            </${Seccion}>
            <${Seccion} n=${2} titulo="Objetivo"><p>${r.objetivo}</p></${Seccion}>
            <${Seccion} n=${3} titulo="Instrumentos aplicados">
              <ul className="flex flex-wrap gap-2">${f.pruebas.map(p => html`<li key=${p} className="text-sm px-2 py-0.5 rounded border border-line">${p}</li>`)}</ul>
            </${Seccion}>
            <${Seccion} n=${4} titulo="Síntesis de la entrevista"><p>${r.sintesis}</p></${Seccion}>
            <${Seccion} n=${5} titulo="Perfil de competencias">
              <div className="flex flex-col gap-2">
                ${Object.entries(f.competencias).map(([k, v]) => html`<div key=${k} className="grid grid-cols-[minmax(0,1fr)_minmax(0,1.3fr)_auto] items-center gap-3 text-sm">
                  <span className="min-w-0">${k}</span>
                  <span className="h-2 rounded-full bg-line overflow-hidden"><span className=${"block h-full rounded-full " + colorNivel(v)} style=${{ width: v * 20 + "%" }}></span></span>
                  <span className="text-xs text-muted tabnum w-[104px] text-right">${v}/5 · ${NIVELES[v]}</span>
                </div>`)}
              </div>
              <p className="mt-2">${r.perfil}</p>
            </${Seccion}>
            <${Seccion} n=${6} titulo="Fortalezas"><ul className="list-disc pl-5 flex flex-col gap-1 marker:text-accent">${r.fortalezas.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul></${Seccion}>
            <${Seccion} n=${7} titulo="Áreas de desarrollo"><ul className="list-disc pl-5 flex flex-col gap-1 marker:text-ochre">${r.areas.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul></${Seccion}>
            <${Seccion} n=${8} titulo="Conclusión y dictamen">
              <p>${r.conclusion}</p>
              <p className=${"mt-2 border-2 rounded-md px-4 py-2 font-semibold tracking-wide text-sm uppercase " + colorDict[f.dictamen]}>Dictamen: ${f.dictamen}</p>
            </${Seccion}>
            <footer className="pt-8 text-sm">
              <div className="w-56 border-t border-muted pt-1">${f.evaluador || "Evaluador/a"}</div>
            </footer>
          </${React.Fragment}>`}
        </article>
      </div>
    </div>

    ${aviso && html`<div role="status" className=${"fixed left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-md shadow-lg text-sm font-medium text-sheet max-w-[90vw] " + (aviso.tipo === "bad" ? "bg-bad" : aviso.tipo === "warn" ? "bg-warn" : "bg-ok")}
      style=${{ bottom: "calc(20px + env(safe-area-inset-bottom, 0px))" }}>${aviso.msg}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>

</body>
</html>
